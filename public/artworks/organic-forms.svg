<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Organic Forms placeholder">
  <rect width="1200" height="1200" fill="#071412"/>
  <style>
    .og { transform-origin: 600px 600px; animation: spin 18s linear infinite; }
    .og2 { transform-origin: 600px 620px; animation: spin 26s linear infinite reverse; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .og, .og2 { animation: none; } }
  </style>
  <ellipse class="og" cx="600" cy="600" rx="280" ry="360" fill="#1F8A72" opacity="0.7"/>
  <ellipse class="og2" cx="620" cy="580" rx="220" ry="300" fill="#12352E" opacity="0.4"/>
  <ellipse cx="600" cy="600" rx="120" ry="160" fill="#E8E2D6" opacity="0.8"/>
  <ellipse cx="560" cy="540" rx="40" ry="70" fill="#0B1C22" opacity="0.9"/>
</svg>
