<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Wind Garden placeholder">
  <rect width="1200" height="1200" fill="#0B1C22"/>
  <style>
    .wg { transform-origin: center bottom; animation: sway 6s ease-in-out infinite; }
    @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .wg { animation: none; } }
  </style>
  <circle cx="900" cy="220" r="70" fill="#E8E2D6"/>
  <g class="wg">
    <ellipse cx="420" cy="780" rx="40" ry="260" fill="#0D3A32"/>
    <ellipse cx="560" cy="740" rx="50" ry="300" fill="#1F8A72"/>
    <ellipse cx="700" cy="800" rx="36" ry="240" fill="#0D3A32"/>
    <ellipse cx="840" cy="760" rx="44" ry="280" fill="#1F8A72"/>
  </g>
  <path d="M0 980 C 300 940, 700 1020, 1200 960 L 1200 1200 L 0 1200 Z" fill="#0D3A32"/>
</svg>
